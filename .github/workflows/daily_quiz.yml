name: Daily P4 Quiz Auto Generator

on:
  schedule:
    # 每天 UTC 09:00 即 香港時間下午 17:00 (UTC+8)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify Environment
        run: |
          python -c "import datetime; print('P4 Quiz Ready:', datetime.datetime.now())"

      - name: Check Status
        run: echo "Daily schedule triggered successfully."
