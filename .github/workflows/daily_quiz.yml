name: Daily P4 Quiz Auto Generator

on:
  push:
    branches: [ "main" ]
  schedule:
    # 每天 UTC 09:00 即 香港時間下午 17:00 (UTC+8)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Auto Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_quiz.py

      - name: Commit and Push New Quiz
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions@users.noreply.github.com'
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily P4 quiz for $(date +'%Y-%m-%d')" && git push)
