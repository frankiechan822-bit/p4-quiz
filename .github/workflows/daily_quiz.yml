name: Daily P4 Quiz Auto Generator

on:
  push:
    branches: [ "main" ]
  schedule:
    # 每天 UTC 09:00 即 香港時間下午 17:00 (UTC+8)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quiz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Execution
        run: |
          echo "P4 Daily Quiz Workflow Triggered Successfully!"
          date
