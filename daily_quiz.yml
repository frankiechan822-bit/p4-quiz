name: Daily P4 Quiz Auto Generator

on:
  schedule:
    # 每天 UTC 09:00 即 香港時間下午 17:00 (UTC+8)
    - cron: '0 9 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊測試

permissions:
  contents: write

jobs:
  generate-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate New Quiz via AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_daily_quiz.py

      - name: Commit and Push New Quiz
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions@users.noreply.github.com'
          git add english.html maths.html chinese.html humanities.html science.html || true
          git diff --staged --quiet || (git commit -m "Auto-generate brand-new P4 questions for $(date +'%Y-%m-%d')" && git push)
