<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>香港小學四年級五科模擬測試平台 (P4 Exam Prep)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
      background-color: #0d0f12;
      color: #e2e8f0;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-center items-center p-4">

  <div class="max-w-xl w-full bg-[#15171c] border border-[#232731] rounded-3xl p-6 sm:p-8 shadow-2xl text-center">
    <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-4 bg-blue-600/20 text-blue-400 border border-blue-500/30">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    <h1 class="text-2xl sm:text-3xl font-extrabold text-white mb-2">小四全科模擬測試平台</h1>
    <p class="text-slate-400 text-sm mb-6">請選擇要進行測試的獨立科目（每科 20 題，限時 20 分鐘）：</p>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-left">
      <a href="english.html" class="p-4 rounded-2xl bg-[#1a1d24] border border-[#262b37] hover:border-blue-500 transition group flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-blue-600/20 text-blue-400 flex items-center justify-center text-lg group-hover:bg-blue-600 group-hover:text-white transition">
          <i class="fa-solid fa-book"></i>
        </div>
        <div>
          <h2 class="text-base font-bold text-white group-hover:text-blue-400 transition">英文科 (English)</h2>
          <p class="text-xs text-slate-400">時態、介詞、Proofreading</p>
        </div>
      </a>

      <a href="maths.html" class="p-4 rounded-2xl bg-[#1a1d24] border border-[#262b37] hover:border-blue-500 transition group flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-emerald-600/20 text-emerald-400 flex items-center justify-center text-lg group-hover:bg-emerald-600 group-hover:text-white transition">
          <i class="fa-solid fa-calculator"></i>
        </div>
        <div>
          <h2 class="text-base font-bold text-white group-hover:text-emerald-400 transition">數學科 (Maths)</h2>
          <p class="text-xs text-slate-400">H.C.F.、L.C.M.、四則運算</p>
        </div>
      </a>

      <a href="chinese.html" class="p-4 rounded-2xl bg-[#1a1d24] border border-[#262b37] hover:border-blue-500 transition group flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-amber-600/20 text-amber-400 flex items-center justify-center text-lg group-hover:bg-amber-600 group-hover:text-white transition">
          <i class="fa-solid fa-pen-nib"></i>
        </div>
        <div>
          <h2 class="text-base font-bold text-white group-hover:text-amber-400 transition">中文科 (Chinese)</h2>
          <p class="text-xs text-slate-400">錯別字、成語、關聯詞</p>
        </div>
      </a>

      <a href="humanities.html" class="p-4 rounded-2xl bg-[#1a1d24] border border-[#262b37] hover:border-blue-500 transition group flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-purple-600/20 text-purple-400 flex items-center justify-center text-lg group-hover:bg-purple-600 group-hover:text-white transition">
          <i class="fa-solid fa-landmark"></i>
        </div>
        <div>
          <h2 class="text-base font-bold text-white group-hover:text-purple-400 transition">人文科 (Humanities)</h2>
          <p class="text-xs text-slate-400">香港地理社區、歷史文化</p>
        </div>
      </a>

      <a href="science.html" class="p-4 rounded-2xl bg-[#1a1d24] border border-[#262b37] hover:border-blue-500 transition group flex items-center gap-3.5 sm:col-span-2">
        <div class="w-10 h-10 rounded-xl bg-rose-600/20 text-rose-400 flex items-center justify-center text-lg group-hover:bg-rose-600 group-hover:text-white transition">
          <i class="fa-solid fa-flask"></i>
        </div>
        <div>
          <h2 class="text-base font-bold text-white group-hover:text-rose-400 transition">Science (English Medium)</h2>
          <p class="text-xs text-slate-400">Earth Structure, Rotation/Revolution, Rocks</p>
        </div>
      </a>
    </div>

    <div class="mt-6 pt-4 border-t border-[#232731] text-xs text-slate-500">
      香港小學四年級校本評估 • 20 分鐘計時及即時評分
    </div>
  </div>

</body>
</html>
